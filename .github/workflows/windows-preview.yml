name: Windows preview installer

# Deliberately NOT [main]. This workflow must never run on the production
# branch, and must never touch the latest-windows release.
on:
  push:
    branches: [ui-redesign-cw]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the preview (ui-redesign-cw only); otherwise build review artifacts
        type: boolean
        required: false
        default: false
      accelerator:
        description: Inference runtime included in the preview installer
        type: choice
        options: [directml, cuda]
        default: directml

permissions:
  contents: write

# Separate group. Sharing latest-windows would cancel in-flight production builds.
concurrency:
  group: preview-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # workflow_dispatch has no branch or repository restriction of its own.
    # This guard is what actually keeps the job from running anywhere but the
    # fork or the parent repository, making the header comment above literally
    # true. Both publish only to their own preview prerelease.
    if: github.repository == 'Feches/Spine-Contour' || github.repository == 'mjayasur/Spine-Contour' || github.repository == 'mjayasur/Spine-Contour-region-research'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download model weights
        run: git lfs pull

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements-export.txt pyinstaller==6.22.2

      - name: Install OCR runtime
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $ocr = "C:/Program Files/Tesseract-OCR"
          if (-not (Test-Path "$ocr/tesseract.exe")) { throw "Tesseract runtime not found." }
          $ocr | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Export and validate ONNX models
        run: python tools/export_onnx.py

      - name: Install NVIDIA application runtime
        if: inputs.accelerator == 'cuda'
        run: |
          python -m pip uninstall -y onnxruntime onnxruntime-directml
          python -m pip install -r backend/requirements-cuda.txt

      - name: Test backend
        run: python -m pytest backend/tests -q

      - name: Test renderer
        # Directory form is broken on Node 24 (treats it as a CJS entry point).
        # Glob form is the one verified to work. See the architecture contract.
        # node --test exits 0 and reports "tests 0" if the glob matches no
        # files, so an exit-code check alone is not enough - parse the pass
        # count out of the runner's own output and fail loudly if it is zero.
        shell: bash
        run: |
          set -o pipefail
          node --test test/*.test.js 2>&1 | tee test-output.log
          test_exit=${PIPESTATUS[0]}
          pass_count=$(grep -oE 'pass [0-9]+$' test-output.log | tail -1 | grep -oE '[0-9]+$')
          echo "renderer test pass count: ${pass_count:-<none found>}"
          if [ "$test_exit" -ne 0 ]; then
            echo "FAIL: node --test exited non-zero ($test_exit)" >&2
            exit 1
          fi
          if [ -z "$pass_count" ] || [ "$pass_count" -eq 0 ]; then
            echo "FAIL: 0 renderer tests ran (glob matched nothing, or every test was skipped) - a green gate that ran nothing is worse than no gate" >&2
            exit 1
          fi
          echo "OK: $pass_count renderer test(s) passed"

      - name: Bundle backend
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name spine-contour-backend
          --distpath backend-dist
          --workpath build/pyinstaller
          --paths .
          --collect-all onnxruntime
          ${{ inputs.accelerator == 'cuda' && '--collect-all nvidia' || '' }}
          --exclude-module torch
          --exclude-module torchvision
          --exclude-module timm
          --exclude-module segmentation_models_pytorch
          --exclude-module onnx
          --exclude-module transformers
          --exclude-module safetensors
          --collect-all uvicorn
          --add-data "backend/onnx;backend/onnx"
          --add-data "C:/Program Files/Tesseract-OCR;ocr"
          backend/standalone.py

      - name: Verify bundled backend
        shell: pwsh
        run: |
          $backend = Start-Process "backend-dist/spine-contour-backend/spine-contour-backend.exe" -ArgumentList "--host", "127.0.0.1", "--port", "8765" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              try {
                $response = Invoke-RestMethod "http://127.0.0.1:8765/health"
                if ($response.status -eq "ok") { $ready = $true; break }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "The bundled backend did not become ready." }
            python tools/packaging/check_bundled_inference.py
            if ($LASTEXITCODE -ne 0) { throw "Bundled ONNX inference verification failed." }
            python tools/packaging/check_bundled_ocr.py
            if ($LASTEXITCODE -ne 0) { throw "Bundled OCR verification failed." }
          } finally {
            Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Reclaim disk before packaging
        shell: pwsh
        run: |
          $before = (Get-PSDrive C).Free / 1GB
          Write-Host ("free before cleanup: {0:N1} GB" -f $before)
          # build/pyinstaller is PyInstaller's intermediate work directory. Once
          # backend-dist exists and has been health-checked, it is dead weight.
          # Only the subdirectory is removed: electron-builder's default
          # directories.buildResources is build/, and neither config overrides it.
          Remove-Item -Recurse -Force build/pyinstaller -ErrorAction SilentlyContinue
          python -m pip cache purge
          if ($LASTEXITCODE -ne 0) {
            Write-Host "pip cache purge returned $LASTEXITCODE (ignored)"
            $global:LASTEXITCODE = 0
          }
          $after = (Get-PSDrive C).Free / 1GB
          Write-Host ("free after cleanup : {0:N1} GB" -f $after)
          # Fail loudly rather than letting the packaging step exhaust the disk
          # and kill the runner, which destroys the logs and leaves no diagnosis.
          if ($after -lt 6) {
            throw ("Only {0:N1} GB free before packaging. The installer build needs roughly 5 GB of headroom." -f $after)
          }

      - name: Assert packaging allowlists agree
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const prod = JSON.parse(fs.readFileSync('package.json', 'utf8')).build.files;
          const yml = fs.readFileSync('electron-builder.preview.yml', 'utf8');
          // windows-latest checks the repo out with CRLF line endings (no .gitattributes
          // rule forces LF for .yml), so a bare \n here made this match fail on every run
          // and it never actually guarded anything.
          const block = yml.match(/^files:\r?\n((?:[ \t]+- .*\r?\n)+)/m);
          if (!block) {
            console.error('FAIL: no files: block found in electron-builder.preview.yml');
            process.exit(1);
          }
          const prev = block[1].trimEnd().split('\n')
            .map(s => s.replace(/^\s*-\s*/, '').trim().replace(/^['"]|['"]$/g, ''));
          console.log('package.json build.files       :', JSON.stringify(prod));
          console.log('electron-builder.preview files :', JSON.stringify(prev));
          const a = JSON.stringify([...prod].sort());
          const b = JSON.stringify([...prev].sort());
          if (a !== b) {
            console.error('FAIL: the two packaging allowlists have diverged.');
            console.error('A missing entry does not fail the build - it ships an installer that opens a blank window.');
            console.error('Add the entry to BOTH package.json build.files and electron-builder.preview.yml files:.');
            process.exit(1);
          }
          console.log('OK: allowlists match');
          NODE

      - name: Build Windows preview installer
        run: npm run package:windows:preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Assert the production installer was not produced
        shell: pwsh
        run: |
          if (Test-Path "dist/Spine-Contour-Windows.exe") {
            throw "Production artifact was built by the preview workflow. The preview config is wrong."
          }
          if (-not (Test-Path "dist/Spine-Contour-Preview-Windows.exe")) {
            throw "Preview artifact missing."
          }
          Write-Host "OK: preview artifact present, production artifact absent"

      - name: Verify packaged desktop source and version
        run: node tools/packaging/check_desktop_bundle.cjs dist

      - uses: actions/upload-artifact@v7
        with:
          name: Spine-Contour-Preview-Windows-${{ inputs.accelerator || 'directml' }}
          path: dist/Spine-Contour-Preview-Windows.exe
          compression-level: 0

      - name: Publish preview release
        if: inputs.accelerator != 'cuda' && github.ref == 'refs/heads/ui-redesign-cw' && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/packaging/publish_preview.py windows
